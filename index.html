<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>質問共有システム</title>
  <style>
    .tab {
      display: inline-block;
      padding: 10px 20px;
      background: #ddd;
      cursor: pointer;
      margin-right: 5px;
    }
    .tab.active {
      background: #aaa;
      font-weight: bold;
    }
    .content {
      display: none;
      margin-top: 20px;
    }
    .content.active {
      display: block;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB9PFIVztBLLN_0RUSL47JNOgNZ-cay2s",
      authDomain: "qa-sharing-system.firebaseapp.com",
      projectId: "qa-sharing-system",
      storageBucket: "qa-sharing-system.firebasestorage.app",
      messagingSenderId: "96565493318",
      appId: "1:96565493318:web:d3649b6d0178ef39847"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>

  <!-- Firestore 質問追加・読み込み・回答保存 -->
  <script>
    function addQuestion() {
      const text = prompt("追加する質問を入力してください：");
      if (!text) return;

      db.collection("questions").add({
        text: text,
        createdAt: new Date()
      }).then(() => {
        alert("質問を追加しました！");
        loadQuestions();
      });
    }

    function loadQuestions() {
      const area = document.getElementById("questionArea");
      area.innerHTML = "";

      db.collection("questions").orderBy("createdAt").get().then(snapshot => {
        snapshot.forEach(doc => {
          const q = doc.data().text;
          const div = document.createElement("div");
          div.innerHTML = `
            <p><strong>${q}</strong></p>
            <input type="text" placeholder="あなたの回答を入力"
                   onchange="saveAnswer('${doc.id}', this.value)">
            <hr>
          `;
          area.appendChild(div);
        });
      });
    }

    function saveAnswer(id, answer) {
      db.collection("questions").doc(id).update({
        answerA: answer
      });
    }

    window.onload = loadQuestions;
  </script>

</head>
<body>

  <h1>質問共有システム</h1>

  <!-- タブ -->
  <div>
    <div class="tab active" onclick="showTab('answerTab')">回答する</div>
    <div class="tab" onclick="showTab('listTab')">回答一覧</div>
  </div>

  <!-- 回答タブ -->
  <div id="answerTab" class="content active">
    <h2>質問に回答する</h2>
    <button onclick="addQuestion()">＋ 質問を追加</button>
    <div id="questionArea"></div>
  </div>

  <!-- 一覧タブ -->
  <div id="listTab" class="content">
    <h2>回答一覧</h2>
    <table border="1">
      <tr>
        <th>No</th>
        <th>Aさん</th>
        <th>Bさん</th>
      </tr>
    </table>
  </div>

  <script>
    function showTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }
  </script>

</body>
</html>
