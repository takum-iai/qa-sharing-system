<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>質問共有システム</title>
  <style>
    .tab {
      display: inline-block;
      padding: 10px 20px;
      background: #ddd;
      cursor: pointer;
      margin-right: 5px;
    }
    .tab.active {
      background: #aaa;
      font-weight: bold;
    }
    .content {
      display: none;
      margin-top: 20px;
    }
    .content.active {
      display: block;
    }
  </style>

  <!-- Firebase SDK（compat版） -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB9PFIVztBLLN_0RUSL47JNOgNZ-cay2s",
      authDomain: "qa-sharing-system.firebaseapp.com",
      projectId: "qa-sharing-system",
      storageBucket: "qa-sharing-system.firebasestorage.app",
      messagingSenderId: "96565493318",
      appId: "1:96565493318:web:d3649b6d0178ef39847"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
  </script>

  <script>
    /* -------------------------
       ログイン / 新規登録
    ------------------------- */
    function login() {
      const email = document.getElementById("loginEmail").value;
      const pass = document.getElementById("loginPass").value;

      auth.signInWithEmailAndPassword(email, pass)
        .then(() => {
          alert("ログインしました！");
          document.getElementById("loginArea").style.display = "none";
          loadQuestions();
        })
        .catch(err => alert("ログイン失敗：" + err.message));
    }

    function signup() {
      const email = document.getElementById("loginEmail").value;
      const pass = document.getElementById("loginPass").value;

      auth.createUserWithEmailAndPassword(email, pass)
        .then(() => alert("登録完了！ログインしてください"))
        .catch(err => alert("登録失敗：" + err.message));
    }

    /* -------------------------
       質問追加
    ------------------------- */
    function addQuestion() {
      const text = prompt("追加する質問を入力してください：");
      if (!text) return;

      db.collection("questions").add({
        text: text,
        createdAt: new Date()
      }).then(() => {
        alert("質問を追加しました！");
        loadQuestions();
      });
    }

    /* -------------------------
       質問一覧（回答入力欄付き）
    ------------------------- */
    function loadQuestions() {
      const area = document.getElementById("questionArea");
      area.innerHTML = "";

      db.collection("questions").orderBy("createdAt").get().then(snapshot => {
        snapshot.forEach(doc => {
          const data = doc.data();
          const div = document.createElement("div");

          div.innerHTML = `
            <p><strong>${data.text}</strong></p>
            <input id="answer_${doc.id}" type="text" placeholder="あなたの回答を入力">
            <button onclick="sendAnswer('${doc.id}')">送信</button>
            <hr>
          `;

          area.appendChild(div);
        });
      });
    }

    /* -------------------------
       回答送信（ログインユーザーごとに保存）
    ------------------------- */
    function sendAnswer(id) {
      const answer = document.getElementById(`answer_${id}`).value;
      const user = auth.currentUser;

      if (!user) {
        alert("ログインしてください");
        return;
      }

      const email = user.email;

      // Aさん / Bさん 判定（メールアドレスで判定）
      let field = "";
      if (email.includes("a@")) field = "answerA";
      else if (email.includes("b@")) field = "answerB";
      else field = "answerOther";

      db.collection("questions").doc(id).update({
        [field]: answer
      }).then(() => {
        alert("回答を送信しました！");
      });
    }

    /* -------------------------
       回答一覧読み込み
    ------------------------- */
    function loadAnswerList() {
      const table = document.querySelector("#listTab table");

      table.querySelectorAll("tr:not(:first-child)").forEach(tr => tr.remove());

      db.collection("questions").orderBy("createdAt").get().then(snapshot => {
        let index = 1;
        snapshot.forEach(doc => {
          const data = doc.data();
          const tr = document.createElement("tr");

          tr.innerHTML = `
            <td>${index}</td>
            <td>${data.answerA || ""}</td>
            <td>${data.answerB || ""}</td>
          `;

          table.appendChild(tr);
          index++;
        });
      });
    }

    /* -------------------------
       タブ切り替え
    ------------------------- */
    function showTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));

      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');

      if (tabId === "answerTab") {
        loadQuestions();
      } else if (tabId === "listTab") {
        loadAnswerList();
      }
    }

    window.onload = () => {
      // ログインしていない場合はログイン画面を表示
      auth.onAuthStateChanged(user => {
        if (user) {
          document.getElementById("loginArea").style.display = "none";
          loadQuestions();
        }
      });
    };
  </script>

</head>
<body>

  <!-- ログイン画面 -->
  <div id="loginArea">
    <h2>ログイン</h2>
    <input id="loginEmail" type="text" placeholder="メールアドレス">
    <input id="loginPass" type="password" placeholder="パスワード">
    <button onclick="login()">ログイン</button>
    <button onclick="signup()">新規登録</button>
    <hr>
  </div>

  <h1>質問共有システム</h1>

  <!-- タブ -->
  <div>
    <div class="tab active" onclick="showTab('answerTab')">回答する</div>
    <div class="tab" onclick="showTab('listTab')">回答一覧</div>
  </div>

  <!-- 回答タブ -->
  <div id="answerTab" class="content active">
    <h2>質問に回答する</h2>
    <button onclick="addQuestion()">＋ 質問を追加</button>
    <div id="questionArea"></div>
  </div>

  <!-- 一覧タブ -->
  <div id="listTab" class="content">
    <h2>回答一覧</h2>
    <table border="1">
      <tr>
        <th>No</th>
        <th>Aさん</th>
        <th>Bさん</th>
      </tr>
    </table>
  </div>

</body>
</html>
