<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.8">
  <title>質問共有システム</title>
  <style>
    .tab {
      display: inline-block;
      padding: 10px 20px;
      background: #ddd;
      cursor: pointer;
      margin-right: 5px;
    }
    .tab.active {
      background: #aaa;
      font-weight: bold;
    }
    .content {
      display: none;
      margin-top: 20px;
    }
    .content.active {
      display: block;
    }
    #userName {
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
    }
    /* カルーセル全体 */
    .carousel-container {
      width: 100%;
      overflow: hidden;
      position: relative;
    }
    
    /* スライドを横に並べる */
    .carousel-track {
      display: flex;
      transition: transform 0.3s ease;
    }
    
    /* 各質問スライド */
    .carousel-slide {
      min-width: 100%;
      box-sizing: border-box;
      padding: 20px;
      text-align: center;
    }
    
    /* 質問テキスト */
    .carousel-slide h3 {
      font-size: 20px;
      margin-bottom: 10px;
    }
    
    /* 回答テキスト */
    .carousel-slide p {
      font-size: 18px;
      margin: 6px 0;
    }
    
    /* 左右ボタン */
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 26px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 10px;
    }
    
    .carousel-btn-left {
      left: 10px;
    }
    
    .carousel-btn-right {
      right: 10px;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBI9PFIv2tBLLN_0RU5L47JNOgNZ-cay2s",
      authDomain: "qa-sharing-system.firebaseapp.com",
      projectId: "qa-sharing-system",
      storageBucket: "qa-sharing-system.appspot.com",
      messagingSenderId: "965605493318",
      appId: "1:965605493318:web:d36649b60d0178fef39847"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const USERS = {
      "ayano": { name: "文乃", pass: "ayano1125", field: "answerA", email: "ayano@ayano.com" },
      "takumi": { name: "拓海", pass: "takumi1017", field: "answerT", email: "takumi@takumi.com" }
    };
  </script>

  <script>
    /* -------------------------
       ログイン
    ------------------------- */
    function login() {
      const id = document.getElementById("loginId").value;
      const pass = document.getElementById("loginPass").value;

      if (!USERS[id] || USERS[id].pass !== pass) {
        alert("ログイン失敗：IDまたはPWが違います");
        return;
      }

      const email = USERS[id].email;

      auth.signInWithEmailAndPassword(email, pass)
        .then(() => {
          const userInfo = USERS[id];
          document.getElementById("loginArea").style.display = "none";
          document.getElementById("userName").innerText = "ログイン中：" + userInfo.name;
          document.getElementById("logoutBtn").style.display = "inline-block";

          document.getElementById("tabArea").style.display = "block";

          showTab("answerTab");
        })
        .catch(err => alert("ログイン失敗：" + err.message));
    }

    /* -------------------------
       ログアウト
    ------------------------- */
    function logout() {
      auth.signOut().then(() => {
        alert("ログアウトしました");

        document.getElementById("loginArea").style.display = "block";
        document.getElementById("userName").innerText = "";
        document.getElementById("logoutBtn").style.display = "none";

        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.getElementById("tabArea").style.display = "none";
      });
    }

    /* -------------------------
       質問追加
    ------------------------- */
    function addQuestion() {
      const text = prompt("追加する質問を入力してください：");
      if (!text) return;

      db.collection("questions").add({
        text: text,
        createdAt: new Date()
      }).then(() => {
        alert("質問を追加しました！");
        loadQuestions();
      });
    }

    /* -------------------------
       質問一覧（回答入力欄付き）
    ------------------------- */
    function loadQuestions() {
      const area = document.getElementById("questionArea");
      area.innerHTML = "";

      db.collection("questions").orderBy("createdAt").get().then(snapshot => {
        snapshot.forEach(doc => {
          const data = doc.data();
          const div = document.createElement("div");

          div.innerHTML = `
            <p><strong>${data.text}</strong></p>
            <input id="answer_${doc.id}" type="text" placeholder="あなたの回答を入力">
            <button onclick="deleteQuestion('${doc.id}')">削除</button>
            <hr>
          `;

          area.appendChild(div);

          const user = auth.currentUser;
          if (user) {
            const email = user.email;
            const userInfo = Object.values(USERS).find(u => u.email === email);
            const field = userInfo.field;

            if (data[field]) {
              document.getElementById(`answer_${doc.id}`).value = data[field];
            }
          }
        });
      });
    }

    /* -------------------------
       一括送信
    ------------------------- */
    function sendAllAnswers() {
      const user = auth.currentUser;
      if (!user) {
        alert("ログインしてください");
        return;
      }

      const email = user.email;
      const userInfo = Object.values(USERS).find(u => u.email === email);
      const field = userInfo.field;

      db.collection("questions").get().then(snapshot => {
        const batch = db.batch();

        snapshot.forEach(doc => {
          const answer = document.getElementById(`answer_${doc.id}`).value;
          const ref = db.collection("questions").doc(doc.id);

          batch.update(ref, {
            [field]: answer
          });
        });

        batch.commit().then(() => {
          alert("すべての回答を送信しました！");
        });
      });
    }

    /* -------------------------
       質問削除
    ------------------------- */
    function deleteQuestion(id) {
      if (!confirm("この質問を削除しますか？")) return;

      db.collection("questions").doc(id).delete()
        .then(() => {
          alert("質問を削除しました！");
          loadQuestions();
        });
    }

    /* -------------------------
       回答一覧読み込み
    ------------------------- */
    let currentSlide = 0;
    
    function loadAnswerList() {
      const track = document.getElementById("carouselTrack");
      track.innerHTML = "";
    
      db.collection("questions").orderBy("createdAt").get().then(snapshot => {
        snapshot.forEach(doc => {
          const data = doc.data();
    
          const slide = document.createElement("div");
          slide.className = "carousel-slide";
    
          slide.innerHTML = `
            <h3>${data.text}</h3>
            <p><strong>文乃：</strong> ${data.answerA || "（未回答）"}</p>
            <p><strong>拓海：</strong> ${data.answerT || "（未回答）"}</p>
          `;
    
          track.appendChild(slide);
        });
    
        // ★ DOM描画後に実行することで幅が正しく取れる
        // ★ スライドが DOM に追加された後にイベント登録する
        setTimeout(() => {
          const track = document.getElementById("carouselTrack");
          if (!track) return;
        
          let startX = 0;
        
          track.addEventListener("touchstart", e => {
            startX = e.touches[0].clientX;
          });
        
          track.addEventListener("touchend", e => {
            const endX = e.changedTouches[0].clientX;
        
            if (startX - endX > 50) {
              nextSlide();
            } else if (endX - startX > 50) {
              prevSlide();
            }
          });
        }, 50);
      });
    }
    
    function updateCarousel() {
      const track = document.getElementById("carouselTrack");
      const slideWidth = track.children[0].clientWidth;
      track.style.transform = `translateX(-${currentSlide * slideWidth}px)`;
    }
    
    function nextSlide() {
      const track = document.getElementById("carouselTrack");
      if (currentSlide < track.children.length - 1) {
        currentSlide++;
        updateCarousel();
      }
    }
    
    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        updateCarousel();
      }
    }

    let startX = 0;

    document.getElementById("carouselTrack").addEventListener("touchstart", e => {
      startX = e.touches[0].clientX;
    });
    
    document.getElementById("carouselTrack").addEventListener("touchend", e => {
      const endX = e.changedTouches[0].clientX;
    
      if (startX - endX > 50) {
        nextSlide();
      } else if (endX - startX > 50) {
        prevSlide();
      }
    });

    /* -------------------------
       タブ切り替え
    ------------------------- */
    function showTab(tabId) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

      const tabs = {
        answerTab: document.querySelector('.tab[onclick="showTab(\'answerTab\')"]'),
        listTab: document.querySelector('.tab[onclick="showTab(\'listTab\')"]')
      };
      tabs[tabId].classList.add('active');

      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');

      if (tabId === "answerTab") {
        loadQuestions();
      } else if (tabId === "listTab") {
        loadAnswerList();
      }
    }

    /* -------------------------
       初期処理
    ------------------------- */
    window.onload = () => {
      auth.onAuthStateChanged(user => {
        if (user) {
          const email = user.email;
          const userInfo = Object.values(USERS).find(u => u.email === email);

          document.getElementById("loginArea").style.display = "none";
          document.getElementById("userName").innerText = "ログイン中：" + userInfo.name;
          document.getElementById("logoutBtn").style.display = "inline-block";

          document.getElementById("tabArea").style.display = "block";

          showTab("answerTab");

        } else {
          document.getElementById("loginArea").style.display = "block";
          document.getElementById("userName").innerText = "";
          document.getElementById("logoutBtn").style.display = "none";

          document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
          document.getElementById("tabArea").style.display = "none";
        }
      });
    };
  </script>

</head>
<body>

  <!-- ログイン画面 -->
  <div id="loginArea">
    <h2>ログイン</h2>
    <input id="loginId" type="text" placeholder="ログインID">
    <input id="loginPass" type="password" placeholder="パスワード">
    <button onclick="login()">ログイン</button>
    <hr>
  </div>

  <!-- ログインユーザー名表示 -->
  <div id="userName"></div>
  <button id="logoutBtn" onclick="logout()" style="display:none;">ログアウト</button>

  <h1>交流のための質問共有</h1>

  <!-- タブ -->
  <div id="tabArea" style="display:none;">
    <div class="tab" onclick="showTab('answerTab')">回答する</div>
    <div class="tab" onclick="showTab('listTab')">回答一覧</div>
  </div>

  <!-- 回答タブ -->
  <div id="answerTab" class="content">
    <button onclick="addQuestion()">＋ 追加</button>
    <button onclick="sendAllAnswers()">送信</button>
    <div id="questionArea"></div>
  </div>

  <!-- 一覧タブ -->
<div id="listTab" class="content">
  <h2>回答一覧</h2>

  <div class="carousel-container">
    <button class="carousel-btn carousel-btn-left" onclick="prevSlide()">←</button>
    <button class="carousel-btn carousel-btn-right" onclick="nextSlide()">→</button>

    <div id="carouselTrack" class="carousel-track"></div>
  </div>
</div>

</body>
</html>
